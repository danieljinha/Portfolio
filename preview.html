<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Preview — Salt & Light Media</title>

    <!--
      DEV-ONLY ZERO-BUILD PREVIEW — not the shipped site.
      This loads the exact same /src/App.jsx (and its data/hooks) through an
      in-browser JSX transform + import map, so it runs with no `npm install`
      and no build step. It's here purely so the design/motion can be seen
      and verified before Node.js is set up.

      The real production entry is index.html, which runs the same App.jsx
      through Vite's dev server / build (`npm run dev` / `npm run build`)
      once dependencies are installed — that path compiles Tailwind for real
      and ships no Babel-in-the-browser overhead.
    -->

    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="/src/styles/custom.css" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Mirrors tailwind.config.js — keep the two in sync if tokens change.
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ink: {
                DEFAULT: '#f4f1ea',
                dim: 'rgba(244,241,234,0.62)',
                faint: 'rgba(244,241,234,0.38)',
              },
              graphite: { DEFAULT: '#15120e', raised: '#1c1712', panel: '#241d16' },
              khaki: { DEFAULT: '#937c5c', bright: '#c2b7a1', dim: 'rgba(147,124,92,0.5)' },
              walnut: { DEFAULT: '#5a3f2b', bright: '#866246', dim: 'rgba(90,63,43,0.55)' },
              emerald: { DEFAULT: '#293e2f', bright: '#3d5d4b', dim: 'rgba(41,62,47,0.55)' },
              hairline: 'rgba(244,241,234,0.12)',
            },
            fontFamily: {
              sans: ['"General Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
              serif: ['"Fraunces"', 'ui-serif', 'Georgia', 'serif'],
            },
            letterSpacing: { tightest: '-0.045em', tighter: '-0.03em' },
          },
        },
      };
    </script>

    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.3.1",
          "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
          "react/jsx-dev-runtime": "https://esm.sh/react@18.3.1/jsx-dev-runtime",
          "react-dom": "https://esm.sh/react-dom@18.3.1",
          "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?external=react",
          "framer-motion": "https://esm.sh/framer-motion@11.11.17?external=react,react-dom",
          "lenis": "https://esm.sh/lenis@1.1.14"
        }
      }
    </script>

    <!--
      Babel Standalone auto-scans the document for type="text/babel" tags
      once it finishes loading (it checks document.readyState itself, so a
      deferred/async load after the tag below is already present is fine —
      no manual trigger needed).
    -->
    <script type="text/babel" data-type="module" data-presets="react" src="/src/App.jsx"></script>
    <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
  </head>
  <body class="bg-graphite text-ink">
    <div id="root"></div>
  </body>
</html>
